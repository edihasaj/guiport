name: Release

# An intentional manual release bumps Version.swift, tags it, and publishes the
# signed artifacts. Routine development pushes must not spend a hosted macOS
# runner or create a release.
on:
  workflow_dispatch:
    inputs:
      run_native:
        description: Explicitly authorize paid Apple packaging from production
        type: boolean
        default: false
      publish:
        description: Explicitly authorize version bump and publication
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    # Releases are cut deliberately from production. The bot guard retains the old
    # loop protection for any future reuse of this workflow.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/production' &&
      inputs.run_native == true && inputs.publish == true &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      next: ${{ steps.bump.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT/GITHUB_TOKEN won't trigger downstream workflows by default;
          # we use the default token here because the bump commit is tagged
          # `chore(release):` and skipped by this same job's guard.
          token: ${{ secrets.GITHUB_TOKEN }}

      # Do this before changing Version.swift, tagging, signing, or creating an
      # upload. These are intentionally hard prerequisites: an ad-hoc bundle is
      # not an acceptable fallback for a release that must retain its macOS
      # identity across upgrades.
      - name: Require macOS distribution credentials
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=""
          for name in CERT_P12_BASE64 CERT_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="${missing}${missing:+, }$name"
            fi
          done
          [ -z "$missing" ] || {
            echo "required macOS release credentials are unavailable: $missing" >&2
            exit 1
          }

      - name: Bump patch version in Version.swift
        id: bump
        run: |
          set -euo pipefail
          file=Sources/GuiportCore/Version.swift
          current=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' "$file" | tr -d '"')
          IFS='.' read -r major minor patch <<<"$current"
          next="$major.$minor.$((patch + 1))"
          echo "Bumping $current → $next"
          sed -i.bak "s/\"$current\"/\"$next\"/" "$file"
          rm "$file.bak"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Commit + tag
        env:
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Sources/GuiportCore/Version.swift
          git commit -m "chore(release): v${NEXT}"
          git tag "v${NEXT}"
          git push origin HEAD:production
          git push origin "v${NEXT}"

  # Build the universal macOS binary for the freshly-tagged version, attach it
  # to the GitHub release, and bump the Homebrew tap so `brew upgrade guiport`
  # tracks it. Runs in the SAME workflow run as `bump` (needs:) because a tag
  # pushed by GITHUB_TOKEN does not trigger a fresh `on: push: tags` run.
  release:
    needs: bump
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production' && inputs.run_native == true && inputs.publish == true
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.bump.outputs.next }}"
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-release-${{ runner.os }}-

      - name: Stamp Info.plist version
        env:
          NEXT: ${{ needs.bump.outputs.next }}
        run: |
          set -euo pipefail
          # Keep the embedded bundle version (shown in permission lists / Get Info)
          # in sync with the release so guiport reports a real version everywhere.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEXT" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" Resources/Info.plist

      - name: Build universal release binary
        run: swift build -c release --arch arm64 --arch x86_64

      # Import the required Developer ID identity into an isolated temporary
      # keychain. The prerequisite job already checked presence without exposing
      # values; this step verifies the certificate type before any app is signed.
      - name: Import Developer ID certificate
        id: cert
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          scripts/ci-import-signing.sh

      # Wrap the universal binary in a guiport.app and sign the BUNDLE (not the
      # bare binary). Homebrew runs bin/guiport from inside this bundle, so macOS
      # shows guiport's real logo in the Privacy panes and — with a Developer ID
      # identity — keys the TCC grant to a stable subject that survives upgrades.
      - name: Assemble + sign guiport.app
        id: bundle
        env:
          NEXT: ${{ needs.bump.outputs.next }}
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          set -euo pipefail
          bindir=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          mkdir -p dist
          scripts/make-app-bundle.sh \
            --bin "$bindir/guiport" \
            --out dist/guiport.app \
            --version "$NEXT" \
            --identity "$IDENTITY"

      # Submission and ticket validation are complete before packaging. The
      # temporary API key and ZIP are removed by ci-notarize.sh in every exit
      # path. A non-Accepted result therefore prevents both the tarball and any
      # GitHub/Homebrew upload.
      - name: Notarize and validate guiport.app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          scripts/ci-notarize.sh \
            --app dist/guiport.app \
            --zip "$RUNNER_TEMP/guiport-notary-input.zip"

      - name: Package notarized tarball
        id: pkg
        env:
          NEXT: ${{ needs.bump.outputs.next }}
        run: |
          set -euo pipefail
          name="guiport-${NEXT}-macos-universal.tar.gz"
          # Nest guiport.app under a versioned wrapper dir. Homebrew auto-descends
          # into a *single* top-level directory when staging; a bare guiport.app at
          # the root means the formula's `prefix.install "guiport.app"` runs with the
          # working dir already *inside* the bundle (Errno::ENOENT - guiport.app).
          # The wrapper dir is the conventional layout brew descends into exactly
          # once, leaving guiport.app addressable. `ditto` preserves the bundle's
          # signature; COPYFILE_DISABLE keeps AppleDouble (._*) files out.
          stage="guiport-${NEXT}"
          ditto dist/guiport.app "dist/${stage}/guiport.app"
          COPYFILE_DISABLE=1 tar -C dist -czf "$name" "$stage"
          sha=$(shasum -a 256 "$name" | awk '{print $1}')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Sanity: the bundled binary must report the version we just tagged.
          got=$(dist/guiport.app/Contents/MacOS/guiport --version | tr -d '[:space:]')
          [ "$got" = "$NEXT" ] || { echo "version mismatch: binary=$got tag=$NEXT"; exit 1; }

      - name: Remove temporary signing material
        if: always()
        run: |
          set -euo pipefail
          original="${RUNNER_TEMP}/guiport-original-keychains.txt"
          if [ -f "$original" ]; then
            original_keychains=()
            while IFS= read -r line; do
              line="${line#"${line%%[![:space:]]*}"}"
              line="${line#\"}"
              line="${line%\"}"
              [ -n "$line" ] && original_keychains+=("$line")
            done < "$original"
            [ "${#original_keychains[@]}" -eq 0 ] || security list-keychains -d user -s "${original_keychains[@]}" || true
          fi
          rm -f "${GUIPORT_CERTIFICATE:-}" "$original"
          if [ -n "${GUIPORT_SIGNING_KEYCHAIN:-}" ] && [ -f "$GUIPORT_SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$GUIPORT_SIGNING_KEYCHAIN" || true
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ needs.bump.outputs.next }}
        run: |
          set -euo pipefail
          gh release create "v${NEXT}" "${{ steps.pkg.outputs.name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${NEXT}" \
            --generate-notes

      - name: Bump Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          NEXT: ${{ needs.bump.outputs.next }}
          SHA: ${{ steps.pkg.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — skipping tap bump. The"
            echo "::warning::release artifact is published; add the secret (a PAT"
            echo "::warning::with contents:write on edihasaj/homebrew-guiport) to"
            echo "::warning::auto-bump the formula on future releases."
            exit 0
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${NEXT}/guiport-${NEXT}-macos-universal.tar.gz"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/edihasaj/homebrew-guiport.git" tap
          f=tap/Formula/guiport.rb
          /usr/bin/sed -i '' -E \
            -e "s#^  url \".*\"#  url \"${url}\"#" \
            -e "s#^  sha256 \".*\"#  sha256 \"${SHA}\"#" \
            -e "s#^  version \".*\"#  version \"${NEXT}\"#" \
            -e "s#assert_match \"[^\"]*\", shell_output#assert_match \"${NEXT}\", shell_output#" \
            "$f"
          # The tarball now ships guiport.app (not a bare binary): install the
          # bundle and symlink bin/guiport into it so the running process is
          # bundle-associated (real logo + stable TCC identity). Targets the old
          # `bin.install "guiport"` line; a no-op once the tap already carries the
          # bundle install, so repeated releases stay correct.
          /usr/bin/perl -0pi -e 's/  def install\n    bin\.install "guiport"\n  end/  def install\n    # Ship + run from the signed guiport.app so macOS shows the real logo in\n    # the Privacy panes and the TCC grant survives upgrades (guiport issue #4).\n    prefix.install "guiport.app"\n    bin.install_symlink prefix\/"guiport.app\/Contents\/MacOS\/guiport" => "guiport"\n  end/' "$f"
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/guiport.rb
          git commit -m "guiport ${NEXT}"
          git push origin HEAD:main

  # Attach a native Windows binary to the same release. Uses the same toolchain
  # as CI's build-windows job (which already passes), so this only adds
  # packaging + upload. Runs after `release` so the GitHub release exists.
  windows:
    needs: [bump, release]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.bump.outputs.next }}"
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.2.0"
      - name: Build release binary
        run: swift build -c release
      - name: Package + upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ needs.bump.outputs.next }}
        run: |
          $ErrorActionPreference = "Stop"
          $bin = & swift build -c release --show-bin-path
          $exe = Join-Path $bin "guiport.exe"
          $got = (& $exe --version).Trim()
          if ($got -ne $env:NEXT) { throw "version mismatch: binary=$got tag=$env:NEXT" }

          # A `swift build` exe dynamically links the Swift Windows runtime
          # (swiftCore.dll, Foundation.dll, ICU, dispatch, ...). Bundle those
          # DLLs so guiport runs on a machine without the toolchain installed.
          $stage = Join-Path $env:RUNNER_TEMP "guiport-win"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe $stage

          $rtDir = Split-Path (Get-Command swiftCore.dll -ErrorAction SilentlyContinue).Source
          if (-not $rtDir) {
            $found = where.exe swiftCore.dll 2>$null | Select-Object -First 1
            if ($found) { $rtDir = Split-Path $found }
          }
          if (-not $rtDir) { throw "could not locate Swift runtime DLLs (swiftCore.dll not on PATH)" }
          Write-Host "Swift runtime dir: $rtDir"

          $patterns = @("swift*.dll","Foundation*.dll","_Foundation*.dll","dispatch.dll","BlocksRuntime.dll","icu*.dll")
          foreach ($pat in $patterns) {
            Get-ChildItem -Path (Join-Path $rtDir $pat) -ErrorAction SilentlyContinue |
              ForEach-Object { Copy-Item $_.FullName $stage -Force }
          }
          $dllCount = (Get-ChildItem (Join-Path $stage "*.dll")).Count
          Write-Host "bundled $dllCount runtime DLLs"
          if ($dllCount -lt 3) { throw "too few runtime DLLs bundled ($dllCount); packaging would not run" }

          $zip = "guiport-$env:NEXT-windows-x64.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          gh release upload "v$env:NEXT" $zip --repo $env:GITHUB_REPOSITORY --clobber

  # Attach a native Linux (x86_64) binary to the same release. Built on 22.04 for
  # a lower glibc floor (2.35) so the binary also runs on 22.04 / Debian 12, not
  # just glibc-2.38+ distros like 24.04.
  linux:
    needs: [bump, release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.bump.outputs.next }}"
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "5.10"
      # Statically link the Swift stdlib so the binary runs on a box without the
      # Swift runtime installed (a bare build needs libswiftCore.so). System libs
      # (glibc, X11, at-spi) are still expected present, as usual for Linux CLIs.
      - name: Build release binary (static stdlib)
        run: swift build -c release --static-swift-stdlib
      - name: Package + upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ needs.bump.outputs.next }}
        run: |
          set -euo pipefail
          bindir=$(swift build -c release --static-swift-stdlib --show-bin-path)
          got=$("$bindir/guiport" --version | tr -d '[:space:]')
          [ "$got" = "$NEXT" ] || { echo "version mismatch: binary=$got tag=$NEXT"; exit 1; }
          name="guiport-${NEXT}-linux-x86_64.tar.gz"
          tar -C "$bindir" -czf "$name" guiport
          gh release upload "v${NEXT}" "$name" --repo "$GITHUB_REPOSITORY" --clobber
